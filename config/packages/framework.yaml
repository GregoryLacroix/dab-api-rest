framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    router:
        utf8: true
        default_uri: '%env(API_PUBLIC_URL)%'
    mailer:
        dsn: '%env(MAILER_DSN)%'
    # Limites anti-abus (par adresse IP)
    rate_limiter:
        register:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        resend:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        order:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # « Mot de passe oublié » : demande et validation (par adresse IP + e-mail)
        password_reset:
            policy: sliding_window
            limit: 8
            interval: '15 minutes'
        contact:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Connexion Google / Facebook : départ et retour (par adresse IP)
        oauth:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'
        # Suivi du paiement après le retour de Stripe (la page de confirmation interroge l'API quelques fois)
        order_status:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'
