framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    router:
        utf8: true
        default_uri: '%env(API_PUBLIC_URL)%'
    mailer:
        dsn: '%env(MAILER_DSN)%'
    # Limites anti-abus (par adresse IP)
    rate_limiter:
        register:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        resend:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        order:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Double authentification : saisie du code de connexion et gestion (par utilisateur et par adresse IP)
        two_factor:
            policy: sliding_window
            limit: 8
            interval: '15 minutes'
        # « Mot de passe oublié » : demande et validation (par adresse IP + e-mail)
        password_reset:
            policy: sliding_window
            limit: 8
            interval: '15 minutes'
        contact:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Avis clients : dépôt d'un avis (par compte)
        review:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Demandes de devis (formulaire public avec photos)
        quote:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Connexion Google / Facebook : départ et retour (par adresse IP)
        oauth:
            policy: sliding_window
            limit: 30
            interval: '10 minutes'
        # Saisie de codes promo / cartes cadeau au panier (limite les essais de codes au hasard)
        codes:
            policy: sliding_window
            limit: 15
            interval: '10 minutes'
        # Inscription « prévenez-moi » (retour en stock)
        stock_alert:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Page publique « Suivre ma commande » (numéro + e-mail)
        order_track:
            policy: sliding_window
            limit: 10
            interval: '10 minutes'
        # Calcul des frais de port au panier
        shipping_quote:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'
        # Achat de carte cadeau (formulaire public)
        gift_card:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Suivi du paiement après le retour de Stripe (la page de confirmation interroge l'API quelques fois)
        order_status:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'
