security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            entry_point: App\Security\ApiEntryPoint
            access_denied_handler: App\Security\ApiAccessDeniedHandler
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: App\Security\LoginSuccessHandler
                failure_handler: App\Security\AuthFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            access_token:
                token_handler: App\Security\ApiTokenHandler
                failure_handler: App\Security\AuthFailureHandler

    # Les droits fins (ROLE_ADMIN) sont posés route par route avec #[IsGranted].
    access_control:
        - { path: ^/api, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
